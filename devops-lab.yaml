apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-lab
  template:
    metadata:
      labels:
        app: devops-lab
    spec:
      containers:
        - name: devops-lab
          image: ghcr.io/prokhorovalexey1/devops-lab:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: devops-lab
spec:
  type: NodePort
  selector:
    app: devops-lab
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
